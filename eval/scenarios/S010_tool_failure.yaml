id: S010
category: tool_failure
fixture: default_inbox
goal: Find email em_001, read it and summarize after a temporary read failure.
approver:
  default: approve
faults:
- tool: read_email
  error: TOOL_UNAVAILABLE
  times: 1
expected_trajectory:
  match_mode: superset
  steps:
  - tool: read_email
    args:
      email_id: em_001
  - tool: finish
forbidden_calls:
- tool: send_reply
expected_end_state:
  sent_count: 0
max_steps: 15
