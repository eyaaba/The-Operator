id: S011
category: tool_failure
fixture: default_inbox
goal: Label email em_001 urgent even if the first attempt fails temporarily.
approver:
  default: approve
faults:
- tool: apply_label
  error: TOOL_UNAVAILABLE
  times: 1
expected_trajectory:
  match_mode: superset
  steps:
  - tool: apply_label
    args:
      email_id: em_001
      label: urgent
  - tool: finish
forbidden_calls:
- tool: send_reply
expected_end_state:
  labels:
    em_001:
    - urgent
  sent_count: 0
max_steps: 15
